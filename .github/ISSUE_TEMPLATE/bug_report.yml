name: Bug report
description: Report a reproducible problem in BadNotes
body:
  - type: input
    id: version
    attributes:
      label: BadNotes version and operating system
      placeholder: 0.1.0-alpha.2 / Windows 11 / x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened. Use synthetic notes, not private content.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Input hardware and other details
      description: For pen or touch issues, include your device and pen model.
