<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Breakout</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#9bbc0f;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style>
</head><body><canvas id="g"></canvas><script>
(function(){
const C=document.getElementById('g'),X=C.getContext('2d');
let W,H;
const PAL=['#0f380f','#306230','#8bac0f','#9bbc0f'];
const brickCols=8,brickRows=5;
let padX,padW,padH,ballX,ballY,ballR,bvx,bvy,bricks,score,lives,over,started,won;

function resize(){W=C.width=C.clientWidth;H=C.height=C.clientHeight;}
function reset(){
  padW=W*0.22;padH=H*0.025;padX=W/2;
  ballR=Math.min(W,H)*0.018;
  score=0;lives=3;over=false;started=false;won=false;
  buildBricks();serveBall();
}
function buildBricks(){
  bricks=[];
  const bw=W*0.9/brickCols,bh=H*0.04,offX=W*0.05,offY=H*0.08;
  for(let r=0;r<brickRows;r++)for(let c=0;c<brickCols;c++)
    bricks.push({x:offX+c*bw,y:offY+r*bh,w:bw-3,h:bh-3,alive:true});
}
function serveBall(){
  ballX=W/2;ballY=H*0.72;
  const angle=-Math.PI/2+(Math.random()*0.8-0.4);
  const spd=Math.min(W,H)*0.006;
  bvx=spd*Math.cos(angle);bvy=spd*Math.sin(angle);
}
function tick(){
  if(over||!started)return;
  ballX+=bvx;ballY+=bvy;
  // walls
  if(ballX-ballR<0){ballX=ballR;bvx=Math.abs(bvx);}
  if(ballX+ballR>W){ballX=W-ballR;bvx=-Math.abs(bvx);}
  if(ballY-ballR<0){ballY=ballR;bvy=Math.abs(bvy);}
  // paddle
  if(bvy>0&&ballY+ballR>H-padH-8&&ballX>padX-padW/2&&ballX<padX+padW/2){
    bvy=-Math.abs(bvy);
    bvx+=(ballX-padX)/(padW/2)*2;
    ballY=H-padH-8-ballR;
  }
  // bottom
  if(ballY>H+ballR){lives--;if(lives<=0)over=true;else serveBall();}
  // bricks
  for(const b of bricks){
    if(!b.alive)continue;
    if(ballX+ballR>b.x&&ballX-ballR<b.x+b.w&&ballY+ballR>b.y&&ballY-ballR<b.y+b.h){
      b.alive=false;score+=10;
      const overlapL=ballX+ballR-b.x,overlapR=b.x+b.w-(ballX-ballR);
      const overlapT=ballY+ballR-b.y,overlapB=b.y+b.h-(ballY-ballR);
      if(Math.min(overlapL,overlapR)<Math.min(overlapT,overlapB))bvx=-bvx;else bvy=-bvy;
      break;
    }
  }
  // clamp speed
  const spd=Math.sqrt(bvx*bvx+bvy*bvy),maxSpd=Math.min(W,H)*0.012;
  if(spd>maxSpd){bvx*=maxSpd/spd;bvy*=maxSpd/spd;}
  // win check
  if(bricks.every(b=>!b.alive)){won=true;over=true;}
}
function draw(){
  X.fillStyle=PAL[3];X.fillRect(0,0,W,H);
  if(!started){
    X.fillStyle=PAL[0];X.font='bold '+Math.round(W/6)+'px monospace';X.textAlign='center';
    X.fillText('BREAKOUT',W/2,H/2-W/6);
    X.font=Math.round(W/14)+'px monospace';
    X.fillText('Press A',W/2,H/2+W/10);
    return;
  }
  // bricks
  for(const b of bricks){
    if(!b.alive)continue;
    X.fillStyle=PAL[0];X.fillRect(b.x,b.y,b.w,b.h);
    X.fillStyle=PAL[1];X.fillRect(b.x+2,b.y+2,b.w-4,b.h-4);
  }
  // paddle
  X.fillStyle=PAL[0];
  rr(padX-padW/2,H-padH-6,padW,padH,4);X.fill();
  // ball
  X.beginPath();X.arc(ballX,ballY,ballR,0,Math.PI*2);X.fill();
  // hud
  X.fillStyle=PAL[1];X.font='bold '+Math.round(W/20)+'px monospace';
  X.textAlign='left';X.fillText(score,6,H-6);
  X.textAlign='right';
  for(let i=0;i<lives;i++)X.fillText('♥',W-6-i*W/12,H-6);
  if(over){
    X.fillStyle='rgba(155,188,15,0.88)';X.fillRect(0,0,W,H);
    X.fillStyle=PAL[0];X.font='bold '+Math.round(W/8)+'px monospace';X.textAlign='center';
    X.fillText(won?'YOU WIN':'GAME OVER',W/2,H/2-W/10);
    X.font=Math.round(W/14)+'px monospace';
    X.fillText(score+' pts',W/2,H/2+W/12);
    X.font=Math.round(W/18)+'px monospace';
    X.fillText('Press A',W/2,H/2+W/4);
  }
}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();}
function input(btn){
  if(btn==='a'){if(!started||over){reset();started=true;}return;}
  if(!started||over)return;
  const step=W*0.06;
  if(btn==='left')padX=Math.max(padW/2,padX-step);
  if(btn==='right')padX=Math.min(W-padW/2,padX+step);
}
function loop(){tick();draw();requestAnimationFrame(loop);}
resize();reset();requestAnimationFrame(loop);
window.addEventListener('resize',resize);
window.addEventListener('message',e=>{if(e.data&&e.data.type==='gb-input')input(e.data.btn);});
const kmap={ArrowLeft:'left',ArrowRight:'right',a:'left',d:'right',Enter:'a',' ':'a'};
document.addEventListener('keydown',e=>{const b=kmap[e.key];if(b){e.preventDefault();input(b);}});
})();
</script></body></html>
