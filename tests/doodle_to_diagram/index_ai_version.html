<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle to Diagram - Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        /* Left Panel - Drawing Canvas */
        .draw-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title span {
            font-size: 24px;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #fff;
            margin: 16px;
            border-radius: 12px;
            overflow: hidden;
        }

        #drawCanvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none; /* Prevent browser gestures */
        }

        /* Prevent Edge swipe navigation */
        .canvas-container {
            overscroll-behavior: none;
            -ms-scroll-chaining: none;
        }

        /* Right Panel - Result */
        .result-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .result-container {
            flex: 1;
            position: relative;
            background: #fff;
            margin: 16px;
            border-radius: 12px;
            overflow: hidden;
        }

        #resultCanvas {
            width: 100%;
            height: 100%;
        }

        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            gap: 16px;
        }

        .placeholder-icon {
            font-size: 64px;
            opacity: 0.5;
        }

        .placeholder-text {
            font-size: 16px;
            text-align: center;
            max-width: 250px;
            line-height: 1.5;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tool-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn.primary {
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: #fff;
        }

        .tool-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .tool-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .tool-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tool-btn.secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .tool-btn.success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        .tool-btn.danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        /* Color picker */
        .color-picker {
            display: flex;
            gap: 4px;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.5);
        }

        /* Stroke width */
        .stroke-width {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-left: 1px solid rgba(255,255,255,0.2);
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .stroke-width input {
            width: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: #fff;
            padding: 4px 8px;
            font-size: 13px;
        }

        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(108, 92, 231, 0.3);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #a0a0a0;
        }

        /* Preview mode */
        .preview-mode .result-container {
            border: 2px solid #6c5ce7;
        }

        .preview-actions {
            display: none;
            gap: 12px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .preview-mode .preview-actions {
            display: flex;
            justify-content: center;
        }

        /* Status bar */
        .status-bar {
            padding: 12px 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .hint {
            color: #6c5ce7;
        }

        /* Analysis info */
        .analysis-info {
            padding: 12px 16px;
            background: rgba(108, 92, 231, 0.1);
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 8px;
            margin: 0 16px 16px;
            font-size: 13px;
            display: none;
        }

        .analysis-info.visible {
            display: block;
        }

        .analysis-info h4 {
            color: #6c5ce7;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .analysis-info ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .analysis-info li {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 35, 50, 0.95);
            border: 1px solid rgba(108, 92, 231, 0.5);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .toast.success {
            border-color: #00b894;
            color: #00b894;
        }

        /* Instructions panel */
        .instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 35, 50, 0.95);
            border: 1px solid rgba(108, 92, 231, 0.3);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .instructions kbd {
            background: rgba(108, 92, 231, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <span>🎨 Draw shapes on the left</span>
        <span>→</span>
        <span>Click <kbd>✨ Clean Up</kbd> to transform</span>
        <span>→</span>
        <span>Accept or adjust</span>
    </div>

    <div class="container">
        <!-- Drawing Panel -->
        <div class="draw-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>✏️</span> Your Doodle
                </div>
                <div class="toolbar">
                    <div class="color-picker">
                        <div class="color-dot active" style="background: #2d3436" data-color="#2d3436"></div>
                        <div class="color-dot" style="background: #0984e3" data-color="#0984e3"></div>
                        <div class="color-dot" style="background: #00b894" data-color="#00b894"></div>
                        <div class="color-dot" style="background: #e17055" data-color="#e17055"></div>
                        <div class="color-dot" style="background: #6c5ce7" data-color="#6c5ce7"></div>
                    </div>
                    <div class="stroke-width">
                        <label>Width:</label>
                        <input type="number" id="strokeWidth" value="3" min="1" max="20">
                    </div>
                    <button class="tool-btn secondary" onclick="clearCanvas()">🗑️ Clear</button>
                    <button class="tool-btn primary" id="cleanupBtn" onclick="cleanupDiagram()">
                        ✨ Clean Up
                    </button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="drawCanvas"></canvas>
            </div>
            <div class="status-bar">
                <span id="strokeCount">0 strokes</span>
                <span class="hint">Draw boxes, circles, arrows, and text!</span>
            </div>
        </div>

        <!-- Result Panel -->
        <div class="result-panel" id="resultPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>✨</span> Clean Diagram
                </div>
                <div class="toolbar">
                    <button class="tool-btn secondary" onclick="downloadResult()">💾 Save PNG</button>
                </div>
            </div>
            <div class="analysis-info" id="analysisInfo">
                <h4>🔍 Detected Elements</h4>
                <ul id="detectedList"></ul>
            </div>
            <div class="result-container">
                <canvas id="resultCanvas"></canvas>
                <div class="placeholder" id="resultPlaceholder">
                    <div class="placeholder-icon">🎯</div>
                    <div class="placeholder-text">
                        Your cleaned diagram will appear here after AI analysis
                    </div>
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div class="loading-text">AI is analyzing your diagram...</div>
                </div>
            </div>
            <div class="preview-actions">
                <button class="tool-btn danger" onclick="rejectPreview()">✕ Reject</button>
                <button class="tool-btn success" onclick="acceptPreview()">✓ Accept & Replace</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== Canvas Setup ==========
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d');
        const resultCanvas = document.getElementById('resultCanvas');
        const resultCtx = resultCanvas.getContext('2d');

        let strokes = [];
        let currentStroke = null;
        let isDrawing = false;
        let currentColor = '#2d3436';
        let strokeWidth = 3;

        // Resize canvases
        function resizeCanvases() {
            const drawContainer = drawCanvas.parentElement;
            const resultContainer = resultCanvas.parentElement;

            drawCanvas.width = drawContainer.clientWidth;
            drawCanvas.height = drawContainer.clientHeight;
            resultCanvas.width = resultContainer.clientWidth;
            resultCanvas.height = resultContainer.clientHeight;

            redrawCanvas();
        }

        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // ========== Drawing ==========
        drawCanvas.addEventListener('pointerdown', startDrawing);
        drawCanvas.addEventListener('pointermove', continueDrawing);
        drawCanvas.addEventListener('pointerup', endDrawing);
        drawCanvas.addEventListener('pointerleave', endDrawing);
        drawCanvas.addEventListener('pointercancel', endDrawing);

        // Prevent Edge/browser gestures
        drawCanvas.addEventListener('gesturestart', e => e.preventDefault());
        drawCanvas.addEventListener('gesturechange', e => e.preventDefault());
        drawCanvas.addEventListener('gestureend', e => e.preventDefault());
        document.addEventListener('touchmove', e => {
            if (isDrawing) e.preventDefault();
        }, { passive: false });

        function startDrawing(e) {
            e.preventDefault();
            e.stopPropagation();

            // Capture pointer for smooth tracking
            drawCanvas.setPointerCapture(e.pointerId);

            isDrawing = true;
            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStroke = {
                points: [{ x, y }],
                color: currentColor,
                width: strokeWidth
            };
        }

        function continueDrawing(e) {
            if (!isDrawing || !currentStroke) return;

            e.preventDefault();

            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStroke.points.push({ x, y });
            redrawCanvas();
        }

        function endDrawing(e) {
            if (e && e.pointerId) {
                drawCanvas.releasePointerCapture(e.pointerId);
            }

            if (currentStroke && currentStroke.points.length > 1) {
                strokes.push(currentStroke);
                updateStrokeCount();
            }
            currentStroke = null;
            isDrawing = false;
            redrawCanvas();
        }

        function redrawCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

            // Draw all strokes
            for (const stroke of strokes) {
                drawStroke(drawCtx, stroke);
            }

            // Draw current stroke
            if (currentStroke) {
                drawStroke(drawCtx, currentStroke);
            }
        }

        function drawStroke(ctx, stroke) {
            if (stroke.points.length < 2) return;

            ctx.strokeStyle = stroke.color;
            ctx.lineWidth = stroke.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);

            for (let i = 1; i < stroke.points.length; i++) {
                ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            }

            ctx.stroke();
        }

        function clearCanvas() {
            strokes = [];
            redrawCanvas();
            updateStrokeCount();

            // Clear result too
            resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
            document.getElementById('resultPlaceholder').style.display = 'flex';
            document.getElementById('analysisInfo').classList.remove('visible');
            document.getElementById('resultPanel').classList.remove('preview-mode');
        }

        function updateStrokeCount() {
            document.getElementById('strokeCount').textContent = `${strokes.length} strokes`;
        }

        // ========== Color Picker ==========
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                currentColor = dot.dataset.color;
            });
        });

        document.getElementById('strokeWidth').addEventListener('change', (e) => {
            strokeWidth = parseInt(e.target.value) || 3;
        });

        // ========== AI Cleanup ==========
        async function cleanupDiagram() {
            if (strokes.length === 0) {
                showToast('Draw something first!', 'error');
                return;
            }

            // Show loading
            document.getElementById('loadingOverlay').classList.add('visible');
            document.getElementById('resultPlaceholder').style.display = 'none';
            document.getElementById('cleanupBtn').disabled = true;

            try {
                // Capture the drawing as image
                const imageData = drawCanvas.toDataURL('image/png');

                // Send to AI for analysis
                const analysis = await analyzeWithAI(imageData);

                if (analysis) {
                    // Draw the clean version
                    drawCleanDiagram(analysis);

                    // Show analysis info
                    showAnalysisInfo(analysis);

                    // Enable preview mode
                    document.getElementById('resultPanel').classList.add('preview-mode');

                    showToast('Diagram cleaned! Review and accept.', 'success');
                }
            } catch (err) {
                console.error('Cleanup error:', err);
                showToast('Error: ' + err.message, 'error');
                document.getElementById('resultPlaceholder').style.display = 'flex';
            } finally {
                document.getElementById('loadingOverlay').classList.remove('visible');
                document.getElementById('cleanupBtn').disabled = false;
            }
        }

        async function analyzeWithAI(imageData) {
            const prompt = `Analyze this hand-drawn sketch and return JSON to recreate it as a clean diagram.

IMPORTANT: Identify what TYPE of diagram this is:
- "flowchart" = boxes connected by arrows showing a process
- "graph" = X/Y axes with data points or lines (like a math function or chart)
- "mindmap" = central topic with branches
- "tree" = hierarchical structure
- "diagram" = generic boxes/shapes with connections

For GRAPHS specifically:
- Detect the axes (usually L-shaped lines)
- Detect data points or curve lines
- Preserve the shape of any curves/lines drawn
- Include axis labels if visible

Return ONLY valid JSON:
{
  "type": "flowchart|graph|mindmap|tree|diagram",
  "shapes": [
    { "type": "rectangle|circle|diamond|ellipse|line|curve|axis", "x": 0-100, "y": 0-100, "width": number, "height": number, "text": "string or null", "color": "#hex" }
  ],
  "lines": [
    { "points": [[x1,y1], [x2,y2], ...], "color": "#hex", "type": "straight|curve|axis" }
  ],
  "connections": [
    { "from": shapeIndex, "to": shapeIndex, "type": "arrow|line", "label": "string or null" }
  ],
  "labels": [
    { "text": "string", "x": 0-100, "y": 0-100 }
  ]
}

Coordinates are percentages (0-100).
For curves/lines, include multiple points to recreate the path.
Preserve colors you see (blue lines stay blue, etc).
Keep the same relative positions and layout.`;

            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: 'You are a diagram analysis expert. Return only valid JSON, no markdown.' },
                        {
                            role: 'user',
                            content: [
                                { type: 'text', text: prompt },
                                { type: 'image_url', image_url: { url: imageData } }
                            ]
                        }
                    ],
                    model: 'gpt-4o-mini',
                    max_tokens: 2000,
                    temperature: 0.3
                })
            });

            if (!response.ok) {
                throw new Error('AI request failed');
            }

            const data = await response.json();
            const content = data.content || data.choices?.[0]?.message?.content || '';

            console.log('AI Response:', content);

            // Parse JSON from response
            try {
                // Try to extract JSON from response
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[0]);
                }
            } catch (e) {
                console.error('Failed to parse AI response:', e);
            }

            // Fallback: generate a simple demo result
            return generateDemoResult();
        }

        function generateDemoResult() {
            // Demo fallback when AI parsing fails
            return {
                type: "flowchart",
                shapes: [
                    { type: "rectangle", x: 40, y: 10, width: 20, height: 12, text: "Start", color: "#0984e3" },
                    { type: "diamond", x: 40, y: 35, width: 20, height: 15, text: "Check?", color: "#e17055" },
                    { type: "rectangle", x: 15, y: 60, width: 20, height: 12, text: "Yes", color: "#00b894" },
                    { type: "rectangle", x: 65, y: 60, width: 20, height: 12, text: "No", color: "#ff6b6b" },
                    { type: "rectangle", x: 40, y: 85, width: 20, height: 12, text: "End", color: "#6c5ce7" }
                ],
                connections: [
                    { from: 0, to: 1, type: "arrow" },
                    { from: 1, to: 2, type: "arrow", label: "Yes" },
                    { from: 1, to: 3, type: "arrow", label: "No" },
                    { from: 2, to: 4, type: "arrow" },
                    { from: 3, to: 4, type: "arrow" }
                ],
                freeText: []
            };
        }

        function drawCleanDiagram(analysis) {
            const ctx = resultCtx;
            const w = resultCanvas.width;
            const h = resultCanvas.height;

            // Clear and set white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            // Handle graph type specially
            if (analysis.type === 'graph') {
                drawGraph(ctx, analysis, w, h);
                return;
            }

            // Draw lines/curves first
            for (const line of (analysis.lines || [])) {
                if (!line.points || line.points.length < 2) continue;

                ctx.strokeStyle = line.color || '#2d3436';
                ctx.lineWidth = line.type === 'axis' ? 3 : 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                const startX = line.points[0][0] * w / 100;
                const startY = line.points[0][1] * h / 100;
                ctx.moveTo(startX, startY);

                if (line.type === 'curve' && line.points.length > 2) {
                    // Smooth curve through points
                    for (let i = 1; i < line.points.length - 1; i++) {
                        const xc = (line.points[i][0] + line.points[i+1][0]) / 2 * w / 100;
                        const yc = (line.points[i][1] + line.points[i+1][1]) / 2 * h / 100;
                        const x = line.points[i][0] * w / 100;
                        const y = line.points[i][1] * h / 100;
                        ctx.quadraticCurveTo(x, y, xc, yc);
                    }
                    const lastPt = line.points[line.points.length - 1];
                    ctx.lineTo(lastPt[0] * w / 100, lastPt[1] * h / 100);
                } else {
                    for (let i = 1; i < line.points.length; i++) {
                        ctx.lineTo(line.points[i][0] * w / 100, line.points[i][1] * h / 100);
                    }
                }
                ctx.stroke();
            }

            // Draw connections (arrows between shapes)
            for (const conn of (analysis.connections || [])) {
                const fromShape = analysis.shapes?.[conn.from];
                const toShape = analysis.shapes?.[conn.to];
                if (!fromShape || !toShape) continue;

                const fromX = (fromShape.x + (fromShape.width || 0) / 2) * w / 100;
                const fromY = (fromShape.y + (fromShape.height || 0)) * h / 100;
                const toX = (toShape.x + (toShape.width || 0) / 2) * w / 100;
                const toY = toShape.y * h / 100;

                drawArrow(ctx, fromX, fromY, toX, toY, conn.label);
            }

            // Draw shapes
            for (const shape of (analysis.shapes || [])) {
                const x = shape.x * w / 100;
                const y = shape.y * h / 100;
                const sw = (shape.width || 15) * w / 100;
                const sh = (shape.height || 10) * h / 100;

                // Light fill with colored border
                ctx.fillStyle = shape.color ? adjustColor(shape.color, 0.2) : '#f8f9fa';
                ctx.strokeStyle = shape.color || '#2d3436';
                ctx.lineWidth = 2;

                if (shape.type === 'rectangle') {
                    const radius = 8;
                    ctx.beginPath();
                    ctx.roundRect(x, y, sw, sh, radius);
                    ctx.fill();
                    ctx.stroke();
                } else if (shape.type === 'circle' || shape.type === 'ellipse') {
                    ctx.beginPath();
                    ctx.ellipse(x + sw/2, y + sh/2, sw/2, sh/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (shape.type === 'diamond') {
                    ctx.beginPath();
                    ctx.moveTo(x + sw/2, y);
                    ctx.lineTo(x + sw, y + sh/2);
                    ctx.lineTo(x + sw/2, y + sh);
                    ctx.lineTo(x, y + sh/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // Draw text
                if (shape.text) {
                    ctx.fillStyle = '#2d3436';
                    ctx.font = 'bold 14px Segoe UI, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(shape.text, x + sw/2, y + sh/2);
                }
            }

            // Draw labels
            for (const label of (analysis.labels || [])) {
                ctx.fillStyle = '#2d3436';
                ctx.font = '16px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label.text, label.x * w / 100, label.y * h / 100);
            }
        }

        // Draw graph/chart type diagrams
        function drawGraph(ctx, analysis, w, h) {
            // Draw axes
            const axisColor = '#2d3436';
            const axisWidth = 3;

            // Find axis lines or draw default
            let hasAxes = false;
            for (const line of (analysis.lines || [])) {
                if (line.type === 'axis') {
                    hasAxes = true;
                    break;
                }
            }

            // Draw all lines
            for (const line of (analysis.lines || [])) {
                if (!line.points || line.points.length < 2) continue;

                ctx.strokeStyle = line.color || (line.type === 'axis' ? axisColor : '#0984e3');
                ctx.lineWidth = line.type === 'axis' ? axisWidth : 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(line.points[0][0] * w / 100, line.points[0][1] * h / 100);

                if (line.type === 'curve' && line.points.length > 2) {
                    // Smooth bezier curve
                    for (let i = 1; i < line.points.length - 1; i++) {
                        const x = line.points[i][0] * w / 100;
                        const y = line.points[i][1] * h / 100;
                        const nextX = line.points[i+1][0] * w / 100;
                        const nextY = line.points[i+1][1] * h / 100;
                        const cpX = (x + nextX) / 2;
                        const cpY = (y + nextY) / 2;
                        ctx.quadraticCurveTo(x, y, cpX, cpY);
                    }
                    const last = line.points[line.points.length - 1];
                    ctx.lineTo(last[0] * w / 100, last[1] * h / 100);
                } else {
                    for (let i = 1; i < line.points.length; i++) {
                        ctx.lineTo(line.points[i][0] * w / 100, line.points[i][1] * h / 100);
                    }
                }
                ctx.stroke();
            }

            // Draw data points
            for (const shape of (analysis.shapes || [])) {
                if (shape.type === 'point' || shape.type === 'circle') {
                    const x = shape.x * w / 100;
                    const y = shape.y * h / 100;
                    const r = (shape.width || 2) * w / 200;

                    ctx.fillStyle = shape.color || '#e17055';
                    ctx.beginPath();
                    ctx.arc(x, y, Math.max(r, 5), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw labels
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px Segoe UI, sans-serif';
            for (const label of (analysis.labels || [])) {
                ctx.textAlign = 'center';
                ctx.fillText(label.text, label.x * w / 100, label.y * h / 100);
            }
        }

        // Helper to lighten/adjust color for fills
        function adjustColor(hex, alpha) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function drawArrow(ctx, fromX, fromY, toX, toY, label) {
            const headLen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);

            ctx.strokeStyle = '#636e72';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#636e72';

            // Line
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
            ctx.closePath();
            ctx.fill();

            // Label
            if (label) {
                const midX = (fromX + toX) / 2;
                const midY = (fromY + toY) / 2;
                ctx.fillStyle = '#2d3436';
                ctx.font = '12px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, midX + 15, midY);
            }
        }

        function showAnalysisInfo(analysis) {
            const list = document.getElementById('detectedList');
            list.innerHTML = '';

            const items = [];
            items.push(`📊 Type: ${analysis.type}`);
            items.push(`🔲 ${analysis.shapes?.length || 0} shapes`);
            items.push(`➡️ ${analysis.connections?.length || 0} connections`);

            const shapeTypes = {};
            for (const s of (analysis.shapes || [])) {
                shapeTypes[s.type] = (shapeTypes[s.type] || 0) + 1;
            }
            for (const [type, count] of Object.entries(shapeTypes)) {
                items.push(`${type}: ${count}`);
            }

            for (const item of items) {
                const li = document.createElement('li');
                li.textContent = item;
                list.appendChild(li);
            }

            document.getElementById('analysisInfo').classList.add('visible');
        }

        function acceptPreview() {
            // Copy result to drawing canvas (replace original)
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawCtx.drawImage(resultCanvas, 0, 0, drawCanvas.width, drawCanvas.height);
            strokes = []; // Clear stroke data since we're now working with the image
            updateStrokeCount();

            document.getElementById('resultPanel').classList.remove('preview-mode');
            showToast('Diagram accepted!', 'success');
        }

        function rejectPreview() {
            document.getElementById('resultPanel').classList.remove('preview-mode');
            resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
            document.getElementById('resultPlaceholder').style.display = 'flex';
            document.getElementById('analysisInfo').classList.remove('visible');
            showToast('Keeping original doodle', 'info');
        }

        function downloadResult() {
            const link = document.createElement('a');
            link.download = 'clean-diagram.png';
            link.href = resultCanvas.toDataURL('image/png');
            link.click();
        }

        // ========== Toast ==========
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible ' + type;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Initial message
        setTimeout(() => showToast('Draw a rough flowchart or diagram!', 'info'), 500);
    </script>
</body>
